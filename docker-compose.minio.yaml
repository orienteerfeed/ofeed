services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ofeed-minio
    restart: unless-stopped
    env_file: ./apps/server/.env
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: ofeed-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file: ./apps/server/.env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/$$S3_BUCKET_PUBLIC || true;
      mc anonymous set download local/$$S3_BUCKET_PUBLIC || true;
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:s3:::%s/*\"]},{\"Action\":[\"s3:ListBucket\"],\"Effect\":\"Allow\",\"Resource\":[\"arn:aws:s3:::%s\"]}]}' \"$$S3_BUCKET_PUBLIC\" \"$$S3_BUCKET_PUBLIC\" > /tmp/ofeed-policy.json;
      mc admin policy create local ofeed-policy /tmp/ofeed-policy.json || true;
      if [ -n \"$$S3_ACCESS_KEY\" ] && [ -n \"$$S3_SECRET_KEY\" ]; then
        mc admin user add local $$S3_ACCESS_KEY $$S3_SECRET_KEY || true;
        mc admin policy attach local ofeed-policy --user $$S3_ACCESS_KEY || true;
      fi;
      exit 0;
      "
    networks:
      - app-network

volumes:
  minio-data:
