services:
  board:
    build:
      context: ../..
      dockerfile: apps/board/Dockerfile
      args:
        NODE_VERSION: 24.15.0
        PNPM_VERSION: 11.4.0
    env_file:
      - ./.env
    environment:
      PORT: 8080
      BOARD_API_UPSTREAM: http://host.docker.internal:3001
    ports:
      - '8080:8080'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
