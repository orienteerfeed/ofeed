{{- if .Values.board.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ofeed.boardServiceName" . }}
  labels:
    {{- include "ofeed.labels" . | nindent 4 }}
    app.kubernetes.io/component: board
spec:
  type: {{ .Values.board.service.type }}
  selector:
    {{- include "ofeed.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: board
  ports:
    - name: http
      port: {{ .Values.board.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
