{{- if .Values.migrations.enabled }}
{{- if not (has .Values.migrations.hook (list "PreSync" "Sync")) }}
{{- fail "migrations.hook must be PreSync or Sync" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ofeed.fullname" . }}-migrate
  labels:
    {{- include "ofeed.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: {{ .Values.migrations.hook | quote }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: {{ .Values.migrations.syncWave | quote }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "ofeed.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: {{ required "vault.role is required when vault.enabled=true" .Values.vault.role | quote }}
        vault.hashicorp.com/auth-path: {{ required "vault.authPath is required when vault.enabled=true" .Values.vault.authPath | quote }}
        vault.hashicorp.com/agent-inject-secret-{{ .Values.vault.injectFileName }}: {{ required "vault.secretPath is required when vault.enabled=true" .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-{{ .Values.vault.injectFileName }}: |
          {{- include "ofeed.vaultTemplate" (dict "path" .Values.vault.secretPath "kvVersion" .Values.vault.kvVersion "secretKeys" .Values.vault.secretKeys) | nindent 10 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "ofeed.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "ofeed.image" (dict "image" .Values.ops.image "component" "ops" "requireDigests" .Values.requireImageDigests) | quote }}
          imagePullPolicy: {{ .Values.ops.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: VAULT_ENV_FILE
              value: {{ ternary (printf "/vault/secrets/%s" .Values.vault.injectFileName) "" .Values.vault.enabled | quote }}
            {{- range $key, $value := .Values.ops.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.ops.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.ops.resources | nindent 12 }}
{{- end }}
