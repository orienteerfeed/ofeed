nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

api:
  replicaCount: 1
  image:
    repository: ghcr.io/orienteerfeed/ofeed/server
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
  env:
    NODE_ENV: production
    PORT: "3001"
    CLIENT_APP_URL: "http://localhost:3000"
    CORS_ORIGIN: "http://localhost:3000"
    CORS_METHODS: "GET,HEAD,POST,PUT,DELETE,OPTIONS"
    CORS_HEADERS: "Content-Type,Authorization,x-orienteerfeed-app-activate-user-url,x-ofeed-app-reset-password-url"
    RATE_LIMIT_WINDOW_MS: "60000"
    RATE_LIMIT_MAX: "100"
    MAP_TILE_SESSION_REQUIRED: "true"
    MAP_TILE_SESSION_TTL_SECONDS: "900"
    LOG_LEVEL: info
    OPENAPI_DOC_PATH: "/doc"
    OPENAPI_REFERENCE_PATH: "/reference"
  envFrom: []
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

web:
  replicaCount: 1
  image:
    repository: ghcr.io/orienteerfeed/ofeed/client
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  env: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

board:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/orienteerfeed/ofeed/board
    tag: ""
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  env: {}
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ingress:
    enabled: false
    className: traefik
    annotations: {}
    hosts: []
    tls: []

ops:
  image:
    repository: ghcr.io/orienteerfeed/ofeed/ops
    tag: ""
    pullPolicy: IfNotPresent
  env: {}
  envFrom: []
  resources: {}

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: ofeed.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

vault:
  enabled: false
  role: ""
  authPath: auth/kubernetes
  secretPath: ""
  kvVersion: v2
  injectFileName: api-env
  secretKeys:
    - DATABASE_URL
    - JWT_TOKEN_SECRET_KEY

migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
