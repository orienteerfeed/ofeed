serviceAccount:
  create: true
  name: ofeed-api

api:
  replicaCount: 2
  image:
    repository: ghcr.io/orienteerfeed/ofeed/server
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    PORT: "3001"
    CLIENT_APP_URL: "https://ofeed.example.com"
    CORS_ORIGIN: "https://ofeed.example.com"
    CORS_METHODS: "GET,HEAD,POST,PUT,DELETE,OPTIONS"
    CORS_HEADERS: "Content-Type,Authorization,x-orienteerfeed-app-activate-user-url,x-ofeed-app-reset-password-url"
    RATE_LIMIT_WINDOW_MS: "60000"
    RATE_LIMIT_MAX: "200"
    MAP_TILE_SESSION_REQUIRED: "true"
    MAP_TILE_SESSION_TTL_SECONDS: "900"
    LOG_LEVEL: info
    OPENAPI_DOC_PATH: "/doc"
    OPENAPI_REFERENCE_PATH: "/reference"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  replicaCount: 2
  image:
    repository: ghcr.io/orienteerfeed/ofeed/client
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  env:
    OFEED_PUBLIC_URL: "https://ofeed.example.com"
    OFEED_BOARD_APP_URL: "https://board.ofeed.example.com"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

board:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/orienteerfeed/ofeed/board
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: board.ofeed.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ofeed-board-tls
        hosts:
          - board.ofeed.example.com

ops:
  image:
    repository: ghcr.io/orienteerfeed/ofeed/ops
    tag: "1.0.0"
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: ofeed.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ofeed-tls
      hosts:
        - ofeed.example.com

vault:
  enabled: true
  role: ofeed-api
  authPath: auth/kubernetes
  secretPath: kv/data/ofeed/api
  kvVersion: v2
  injectFileName: api-env
  secretKeys:
    - DATABASE_URL
    - JWT_TOKEN_SECRET_KEY
    - MAPY_API_KEY
    - MAP_TILE_COOKIE_SECRET

migrations:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
