name: ofeed

services:
  api-bootstrap:
    image: ofeed-ops
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: ops
      args:
        NODE_VERSION: 24.15.0
        PNPM_VERSION: 11.4.0
    env_file: ./apps/server/.env
    environment:
      - NODE_ENV=production
    restart: "no"
    networks:
      - app-network

  api:
    image: ofeed-server
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
      target: production
      args:
        NODE_VERSION: 24.15.0
        PNPM_VERSION: 11.4.0
    env_file: ./apps/server/.env
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      api-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  frontend:
    image: ofeed-client
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
      args:
        NODE_VERSION: 24.15.0
        PNPM_VERSION: 11.4.0
    env_file: ./apps/client/.env
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  board:
    image: ofeed-board
    build:
      context: .
      dockerfile: ./apps/board/Dockerfile
      args:
        NODE_VERSION: 24.15.0
        PNPM_VERSION: 11.4.0
    env_file: ./apps/board/.env
    ports:
      - "${BOARD_PORT:-3002}:8080"
    environment:
      - PORT=8080
      - BOARD_API_UPSTREAM=http://api:3001
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  app-network:
    driver: bridge
