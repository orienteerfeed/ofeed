name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Optional emergency override; auto uses Conventional Commits
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      resume_version:
        description: Resume an already prepared release after a partial failure
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ofeed-stable-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter ofeed-monorepo
      - name: Release from Conventional Commits after exact candidate qualification
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_WRITE: "true"
          RELEASE_OVERRIDE: ${{ inputs.release_type }}
          RESUME_VERSION: ${{ inputs.resume_version }}
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: node scripts/release/release.mjs

  # Keeps package.json and the source Helm chart (version/appVersion) on the released X.Y.Z.
  sync-version-pr:
    needs: release
    if: ${{ needs.release.outputs.version != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: npm install --no-save --no-audit --no-fund yaml@2.9.1
      - run: node scripts/release/update-package-version.mjs "$VERSION"
        env:
          VERSION: ${{ needs.release.outputs.version }}
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/version-sync
          delete-branch: true
          title: "chore(version): sync package.json and Helm chart to v${{ needs.release.outputs.version }}"
          commit-message: "chore(version): sync package.json and Helm chart to v${{ needs.release.outputs.version }} [skip release]"
          body: Syncs root `package.json` and `deploy/helm/ofeed/Chart.yaml` (`version`, `appVersion`) with release `v${{ needs.release.outputs.version }}`.
          labels: |
            release
            automated
          add-paths: |
            package.json
            deploy/helm/ofeed/Chart.yaml
