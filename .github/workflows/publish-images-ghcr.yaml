name: Publish release images to GHCR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate semantic release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"
          if [[ ! "$tag_name" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Refusing non-release tag: $tag_name"
            exit 1
          fi

          echo "version=${tag_name#v}" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate-release-tag
    name: Build and push ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            image: ghcr.io/orienteerfeed/ofeed/server
            dockerfile: apps/server/Dockerfile
            target: production
          - component: ops
            image: ghcr.io/orienteerfeed/ofeed/ops
            dockerfile: apps/server/Dockerfile
            target: ops
          - component: client
            image: ghcr.io/orienteerfeed/ofeed/client
            dockerfile: apps/client/Dockerfile
            target: runner
          - component: board
            image: ghcr.io/orienteerfeed/ofeed/board
            dockerfile: apps/board/Dockerfile
            target: runner

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ matrix.image }}:${{ needs.validate-release-tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-release-tag.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ghcr-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.component }}

      - name: Verify published manifest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ matrix.image }}:${{ needs.validate-release-tag.outputs.version }}"
          docker buildx imagetools inspect "$image"
