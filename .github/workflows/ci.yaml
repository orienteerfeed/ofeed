name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUSKY: 0

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare app env files
        run: |
          cp apps/client/.env.example apps/client/.env
          cp apps/server/.env.example apps/server/.env

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: GraphQL type check
        run: pnpm type-check:graphql

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deployment-contract:
    name: Validate deployment contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.18.6
      - run: ruby scripts/delivery/test-chart.rb
      - run: ruby scripts/delivery/test-db-deploy.rb
      - run: python3 -m unittest discover -s scripts/delivery -p 'test_*.py'

  deploy-dev:
    name: Deploy develop to dev
    needs: [validate, deployment-contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-dev.yaml
    secrets:
      gitops-deploy-key: ${{ secrets.OFEED_GITOPS_DEPLOY_KEY }}
      argocd-dev-token: ${{ secrets.OFEED_ARGOCD_DEV_TOKEN }}
